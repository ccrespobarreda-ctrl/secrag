# Local Postgres with pgvector already compiled in.
#
# Building pgvector from source on Windows is a fight; this image ships with it.
#
#   docker compose up -d
#   $env:DATABASE_URL = "postgresql://secrag:secrag@localhost:5433/secrag"
#
# Port 5433 on purpose: if you already run Postgres locally it owns 5432, and
# the collision produces a confusing "database does not exist" rather than a
# clear port error.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: secrag
      POSTGRES_PASSWORD: secrag
      POSTGRES_DB: secrag
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secrag"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
