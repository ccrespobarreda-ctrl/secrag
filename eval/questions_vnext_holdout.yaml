  question: How do Deckers Outdoor and Gap manage inventory risk when demand must be forecast before products are sold?
  type: comparative
  answerable: true
  gold_chunk_ids:
  - 822
  - 1513
  - 1514
  gold_answer: Deckers faces long lead times that require manufacturing decisions months before anticipated demand and manages inventory through forecasts,
    existing orders, SKU discipline, lead-time reduction, liquidation channels and pre-season ordering. Gap likewise orders merchandise before trends are
    confirmed, creating markdown and shortage risk, and invests in inventory optimization, in-season response, customer-behavior analysis and improved assortment
    allocation.
  notes: vNext comparative holdout. Gold evidence manually audited during benchmark construction; includes separate Gap risk and mitigation chunks.
  gold_chunks:
